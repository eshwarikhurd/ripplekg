# RippleKG company universe: EV-battery and critical-minerals supply chain.
#
# Filers (cik set) are downloaded and can be scored in the evaluation if they have
# US-listed shares. Non-filers (no cik) never have filings of their own, but appear
# as graph nodes when a filer's documents mention them.
#
# search_names are exact phrases for EDGAR full-text search. Avoid bare words that
# also have ordinary meanings (for example "Ford", "Vale", "Lucid").
#
# Non-US companies: `ticker` stays empty (it means a US listing with SEC filings); `home_ticker` is
# the main home-exchange listing in Yahoo-style form (300750.SZ, 6752.T, BMW.DE), `other_tickers`
# any further listings, `listing` one of public | private | jv | subsidiary. Every home ticker was
# checked against an exchange or data-provider source on 2026-10-21.
#
# tiers: miner_refiner | diversified_miner | materials_components | cells_storage | recycler | automaker
# CIKs come from SEC's company_tickers.json or, for delisted companies, from EDGAR
# full-text search display names. `ripplekg universe check` re-validates them.

