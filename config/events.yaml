# RippleKG benchmark events. Frozen with docs/protocol.md; later changes go in the
# protocol's "Deviations" section, never silently.
#
# Fields
#   origin      where the shock starts: node labels from the ontology, i.e. a company ticker or ID
#               from universe.yaml, or the short name of a curated node ("Lithium", "Chile").
#   shock_type  supply_shock (propagates downstream) | demand_shock (upstream) | mixed (both)
#   sign        expected direction for the origin: negative | positive | mixed
#   announced   date the information first became public (local date of the first credible report)
#   timing      before_open | during_market | after_close | non_trading_day | unknown (US Eastern)
#   day0        first US trading day the market could react (protocol section 3)
#   named       universe companies named in the primary source; excluded from scoring for this event
#   split       dev | test for primary events (pre-registered, see events.assign_split); none for macro
#
# Every date was checked against the listed sources; SEC filings are cited where the origin is a filer.

