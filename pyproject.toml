[project]
name = "ripplekg"
version = "0.0.1"
description = "Temporal supply-chain knowledge graph for tracing disruptions, evaluated with stock-price event studies"
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Eshwari Khurd" }]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.0",
    "lxml>=5.2",
    "pandas>=2.2",
    "pyarrow>=17",
    "python-dotenv>=1.0",
    "pyvis>=0.3.2",
    "pyyaml>=6.0",
    "requests>=2.32",
    "streamlit>=1.40",
]

[project.scripts]
ripplekg = "ripplekg.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ripplekg"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
